<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".27"/>
      <stop offset="1" stop-color="#E6EEFF" stop-opacity=".13"/>
    </linearGradient>
  </defs>
  <g fill="url(#glass)" stroke="#AFC1E3" stroke-opacity=".32" stroke-width="1.25" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="-.35">
    <!-- Top: 2 pills -->
    <g transform="translate(450 82)"><rect width="330" height="82" rx="41"/><text x="165" y="51" text-anchor="middle" fill="#7890C4" fill-opacity=".48">tratamiento</text></g>
    <g transform="translate(820 82)"><rect width="330" height="82" rx="41"/><text x="165" y="51" text-anchor="middle" fill="#7890C4" fill-opacity=".48">registro médico</text></g>
    <!-- Second row: 3 pills -->
    <g transform="translate(265 240)"><rect width="330" height="82" rx="41"/><text x="165" y="51" text-anchor="middle" fill="#7890C4" fill-opacity=".48">paciente</text></g>
    <g transform="translate(635 240)"><rect width="330" height="82" rx="41"/><text x="165" y="51" text-anchor="middle" fill="#7890C4" fill-opacity=".48">doctor</text></g>
    <g transform="translate(1005 240)"><rect width="330" height="82" rx="41"/><text x="165" y="51" text-anchor="middle" fill="#7890C4" fill-opacity=".48">vitales</text></g>
    <!-- Wide center: 4 pills -->
    <g transform="translate(80 398)"><rect width="330" height="82" rx="41"/><text x="165" y="51" text-anchor="middle" fill="#7890C4" fill-opacity=".48">temperatura</text></g>
    <g transform="translate(450 398)"><rect width="330" height="82" rx="41"/><text x="165" y="51" text-anchor="middle" fill="#7890C4" fill-opacity=".48">laboratorios</text></g>
    <g transform="translate(820 398)"><rect width="330" height="82" rx="41"/><text x="165" y="51" text-anchor="middle" fill="#7890C4" fill-opacity=".48">pagos</text></g>
    <g transform="translate(1190 398)"><rect width="330" height="82" rx="41"/><text x="165" y="51" text-anchor="middle" fill="#7890C4" fill-opacity=".48">aseguradoras</text></g>
    <!-- Fourth row: 3 pills -->
    <g transform="translate(265 556)"><rect width="330" height="82" rx="41"/><text x="165" y="51" text-anchor="middle" fill="#7890C4" fill-opacity=".48">transacción</text></g>
    <g transform="translate(635 556)"><rect width="330" height="82" rx="41"/><text x="165" y="51" text-anchor="middle" fill="#7890C4" fill-opacity=".48">cobro</text></g>
    <g transform="translate(1005 556)"><rect width="330" height="82" rx="41"/><text x="165" y="51" text-anchor="middle" fill="#7890C4" fill-opacity=".48">cancelamiento</text></g>
    <!-- Base: 2 pills -->
    <g transform="translate(450 714)"><rect width="330" height="82" rx="41"/><text x="165" y="51" text-anchor="middle" fill="#7890C4" fill-opacity=".48">registro médico</text></g>
    <g transform="translate(820 714)"><rect width="330" height="82" rx="41"/><text x="165" y="51" text-anchor="middle" fill="#7890C4" fill-opacity=".48">pagos</text></g>
